name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Generate synthetic data & build database
        working-directory: backend
        run: |
          python scripts/generate_data.py
          python scripts/init_db.py
      - name: Test suite (140 tests: firewall, invariants, DES, events, standards, governance, eval)
        working-directory: backend
        run: python -m pytest tests/ -q
      - name: Determinism check (network CSVs byte-identical on re-run)
        working-directory: backend
        run: |
          shasum data/../../data/synthetic/dim_transport_services.csv data/../../data/synthetic/fact_allocations.csv > /tmp/h1 || true
          python scripts/generate_data.py
          shasum ../data/synthetic/dim_transport_services.csv ../data/synthetic/fact_allocations.csv > /tmp/h2
          python scripts/generate_data.py
          shasum ../data/synthetic/dim_transport_services.csv ../data/synthetic/fact_allocations.csv > /tmp/h3
          diff /tmp/h2 /tmp/h3
      - name: OpenAPI contract in sync
        working-directory: backend
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build (type check + compile)
        working-directory: frontend
        run: pnpm build
